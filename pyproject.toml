[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "serp-feature-ownership"
version = "1.0.0"
description = "Who owns featured snippets, PAA, video and other SERP features for your keywords"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Meer Hamza", email = "meerhamza5@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["requests>=2.28", "beautifulsoup4>=4.11", "pandas>=1.5", "openpyxl>=3.1", "click>=8.1"]
keywords = ["seo", "serp", "feature", "ownership"]

[project.urls]
Homepage = "https://github.com/marketing-MEER/serp-feature-ownership"
"SEO Toolbox" = "https://github.com/marketing-MEER/seo-toolbox"
LinkedIn = "https://www.linkedin.com/in/meerhamza-seo"

[project.scripts]
serp-feature-ownership = "serp_feature_ownership.cli:main"

[tool.setuptools]
packages = ["serp_feature_ownership"]
